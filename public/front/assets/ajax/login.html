<div class="login-popup">
    <div class="tab tab-nav-boxed tab-nav-center tab-nav-underline">
        <ul class="nav nav-tabs text-uppercase" role="tablist">
            <li class="nav-item">
                <a href="#sign-in" class="nav-link active">Sign In</a>
            </li>
            <li class="nav-item">
                <a href="#sign-up" class="nav-link">Sign Up</a>
            </li>
        </ul>
        <div class="tab-content">
            <div class="tab-pane active" id="sign-in">

                <form id="signinUser">

                    <div class="form-group">
                        <label>Phone or Email Address *</label>
                        <input type="text"
                               class="form-control signin_login"
                               name="login"
                               id="login"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password"
                               class="form-control signin_password"
                               name="password"
                               id="signin_password"
                               required>
                    </div>

                    <div class="form-checkbox d-flex align-items-center justify-content-between">

                        <div>
                            <input type="checkbox"
                                   class="custom-checkbox"
                                   id="remember"
                                   name="remember">

                            <label for="remember">
                                Remember me
                            </label>
                        </div>

                        <a href="#" class="text-primary" id="forgot">
                            Forgot Password?
                        </a>

                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        Sign In
                    </button>

                </form>

            </div>
            <div class="tab-pane" id="sign-up">
            <form id="signupUser"> 

                <div class="form-group">
                    <label>Your Name *</label>
                    <input type="text" class="form-control signup-name" name="name" id="name" required>
                </div>

                <div class="form-group">
                    <label>Your Phone Number *</label>
                    <input type="text" class="form-control signup-phone" name="phone" id="phone" required>
                </div>

                <div class="form-group">
                    <label>Your Email address</label>
                    <input type="text" class="form-control signup-email" name="email" id="email_1">
                </div>
                <div class="form-group mb-5">
                    <label>Password *</label>
                    <input type="password" class="form-control signup-password" name="password" id="password_1" required>
                </div>

                <div class="form-group mb-5">
                    <label>Confirm Password *</label>
                    <input type="password" class="form-control signup-confirm-password" name="confirm_password" id="password_2" required>
                </div>

                <p class="d-none">Your personal data will be used to support your experience 
                    throughout this website, to manage access to your account, 
                    and for other purposes described in our <a href="#" class="text-primary">privacy policy</a>.</p>
                
                <button type="submit" class="btn btn-primary">Sign Up</button>
            </div>
           </form>
           
        </div>
        <p class="text-center d-none">Sign in with social account</p>
        <div class="social-icons social-icon-border-color d-flex justify-content-center d-none">
            <a href="#" class="social-icon social-facebook w-icon-facebook d-none"></a>
            <a href="#" class="social-icon social-twitter w-icon-twitter d-none"></a>
            <a href="#" class="social-icon social-google fab fa-google d-none"></a>
        </div>
    </div>
</div>
